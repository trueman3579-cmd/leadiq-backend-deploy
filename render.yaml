services:
  - type: web
    name: leadiq-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health/live
    envVars:
      - key: PYTHONPATH
        value: /opt/render/project/src/backend
